# Publishes only the two teardown pages to GitHub Pages: the laptop (at / and /laptop/) and the phone (at /phone/).
name: Deploy teardown pages to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['laptop-teardown/laptop-teardown.html', 'nord-ce4-lite-teardown/nord-teardown.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/laptop _site/phone
          cp laptop-teardown/laptop-teardown.html _site/index.html
          cp laptop-teardown/laptop-teardown.html _site/laptop/index.html
          cp nord-ce4-lite-teardown/nord-teardown.html _site/phone/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
