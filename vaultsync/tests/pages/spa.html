<!doctype html><html><head><meta charset="utf-8"><title>SPA</title></head>
<body><nav><button id="go">Go to login</button></nav><main id="view"><h1>Home</h1></main>
<script>
document.getElementById('go').addEventListener('click', () => {
  history.pushState({}, '', '/spa/login');
  setTimeout(() => {
    document.getElementById('view').innerHTML =
      '<h1>SPA login</h1><div class="login"><input id="username" name="username" placeholder="Username">' +
      '<input id="password" type="password"><button type="button" id="signin">Sign in</button></div>';
  }, 200);
});
</script></body></html>
