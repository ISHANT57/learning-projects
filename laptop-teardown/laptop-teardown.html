/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

watches the power button, the lid, the battery gauge and the USB-C port.',log:["[EC] always-on rail up (3.3 V)","[EC] battery gauge read over SMBus","[EC] waiting for power button"]},{id:"pwr",t:1.4,d:1.4,title:"Power button pressed",hl:["keyboard","ec","pd"],rails:["aon","vsys"],text:"The EC sees the button, checks that the battery or the adapter can supply power, and lets the main system rail (VSYS) through. If a USB-C charger is attached, the PD controller has already negotiated 20 V.",log:["[EC] power button event","[EC] VSYS enabled","[PD] contract: 20 V (USB Power Delivery)"]},{id:"rails",t:2.8,d:1.8,title:"Rails power up in order",hl:["vrm","ram","ssd","wifi"],rails:["aon","vsys","5v","3v3","ddr","core"],text:'The platform needs its supplies in a fixed sequence: 5 V and 3.3 V first, then the DDR5 modules (each makes its 1.1 V on board), then the CPU core rail. When all are stable the EC asserts "power good".',log:["[PWR] 5 V good","[PWR] 3.3 V good","[PWR] DDR5 VDD/VDDQ 1.1 V good","[PWR] CPU core rail good","[PWR] PWROK asserted"]},{id:"reset",t:4.6,d:1.4,title:"CPU leaves reset",hl:["soc","bios"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"An x86 core starts in a primitive mode and fetches its first instruction from the reset vector, 16 bytes below the 4 GiB line (0xFFFFFFF0). The chipset maps that address to the SPI flash chip that holds the firmware.",log:["[CPU] reset released","[CPU] fetch 0xFFFFFFF0 -> SPI flash","[CPU] microcode update applied"]},{id:"pei",t:6,d:2.2,title:"Firmware: train the memory",hl:["soc","ram","bios"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"UEFI early phases (SEC, PEI) run from cache because no RAM works yet. They read each module's SPD chip, then train the DDR5 interface: they tune delays so every data line is sampled at the centre of its eye. When training succeeds, DRAM becomes usable and the firmware moves into it.",log:["[PEI] cache-as-RAM","[PEI] read SPD: DDR5 SO-DIMM x2","[PEI] DDR5 training: CA, DQS, DQ","[PEI] memory ready, firmware copied to RAM"]},{id:"dxe",t:8.2,d:2,title:"Firmware: find the hardware",hl:["soc","ssd","wifi","gpu","panel"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"The DXE phase enumerates the PCIe tree (SSD, Wi-Fi, GPU), brings up USB and the keyboard, and starts the display. The first pixels appear on the panel over eDP.",log:["[DXE] PCIe: NVMe SSD, Wi-Fi, GPU found","[DXE] USB, keyboard ready","[DXE] display output on (eDP)"]},{id:"bds",t:10.2,d:1.6,title:"Boot manager reads the SSD",hl:["ssd","soc"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"The boot manager reads the boot order from firmware variables, reads the GPT partition table on the SSD, and finds the EFI System Partition (FAT32). With Secure Boot on, it checks the bootloader's signature before running it.",log:["[BDS] boot order: Boot0001","[BDS] GPT found, ESP (FAT32)","[BDS] Secure Boot: signature OK","[BDS] load \\EFI\\BOOT\\BOOTX64.EFI"]},{id:"load",t:11.8,d:1.8,title:"Kernel loads into RAM",hl:["ssd","ram","soc"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"The bootloader asks the SSD for the kernel and the initial RAM disk. Each read is an NVMe transfer straight into DRAM (see the SSD to RAM view). Then it jumps into the kernel.",log:["[LDR] read kernel image (NVMe)","[LDR] read initramfs (NVMe)","[LDR] ExitBootServices, jump to kernel"]},{id:"kernel",t:13.6,d:2,title:"Operating system starts",hl:["soc","ram","ssd","wifi","gpu"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"The kernel sets up virtual memory and the scheduler, loads drivers (NVMe, Wi-Fi, GPU, input), mounts the root file system, and starts the first user program. The fans start to follow the EC's temperature policy.",log:["[KRN] paging and scheduler up","[KRN] drivers: nvme, wifi, gpu, hid","[KRN] root file system mounted","[KRN] start init (PID 1)"]},{id:"ready",t:15.6,d:2.4,title:"Desktop ready",hl:["panel","keyboard","touchpad","wifi"],rails:["aon","vsys","5v","3v3","ddr","core"],text:"Services start, Wi-Fi joins a network, the login screen draws. The whole path from the button took a few seconds on a real machine; here it is stretched so each step can be read.",log:["[SYS] services started","[WIFI] associated","[GUI] login screen"]}],kl=hn[hn.length-1].t+hn[hn.length-1].d,Mh=i=>{let e=0;for(;e<hn.length-1&&hn[e+1].t<=i;)e++;return{i:e,step:hn[e],k:ds((i-hn[e].t)/hn[e].d)}};function zl(i="read",e=!1){let t=Ol(i,e),n=Object.fromEntries(t.ev.map(c=>[c.cmd,c])),s=i==="read"?"RD":"WR",r=[],a=(c,l,u,p,d,f,x={})=>r.push({id:c,name:l,dur:u,clk0:p,clk1:d,text:f,...x});a("miss",i==="read"?"Cache miss":"Store leaves the core",1.5,0,0,i==="read"?"A load asks for an address that is in none of the caches: L1, L2 and L3 all miss, so the request goes to the memory controller.":"A dirty cache line is evicted. The memory controller turns it into a write to DRAM.",{who:"cpu"}),e||(a("pre","PRE",.8,n.PRE.t,n.PRE.t+2,"PRECHARGE: a command packet on the CA bus tells the bank to close the row that is open.",{pkt:"PRE",who:"cmd"}),a("trp","tRP wait",1,n.PRE.t+2,n.ACT.t,`Row precharge time: ${Rt.trp} clocks = ${(Rt.trp*Nt.tck).toFixed(1)} ns while the bit lines settle.`,{who:"dram"}),a("act","ACT",.8,n.ACT.t,n.ACT.t+2,"ACTIVATE: the row address is sent. The whole row is copied into the sense amplifiers.",{pkt:"ACT",who:"cmd"}),a("trcd","tRCD wait",1,n.ACT.t+2,n[s].t,`Row-to-column delay: ${Rt.trcd} clocks = ${(Rt.trcd*Nt.tck).toFixed(1)} ns until the row is ready for column access.`,{who:"dram"})),a("rw",s,.8,n[s].t,n[s].t+2,i==="read"?"READ: the column address is sent on the CA bus.":"WRITE: the column address is sent, then the data follows after the write latency.",{pkt:s,who:"cmd"}),a("lat",i==="read"?"CAS latency":"Write latency",1,n[s].t+2,t.tData,i==="read"?`CAS latency: ${Rt.cl} clocks = ${Nt.tCL.toFixed(1)} ns until the first data bit appears.`:`Write latency: ${Nt.wl} clocks (CL - 2): the controller waits, then drives the data.`,{who:"dram"}),a("burst",i==="read"?"Data burst":"Write burst",1.6,t.tData,t.tEnd,`16 transfers on 32 data lines (two per clock, strobed by DQS) = ${Nt.bytes} bytes: one cache line in ${Nt.tBurst.toFixed(1)} ns.`,{who:"data"}),a("fill",i==="read"?"Fill caches":"Done",1,t.tEnd,t.tEnd,i==="read"?"The line is stored in L3, L2 and L1 and the waiting instruction continues. Next time this address is a cache hit.":"The line is now in DRAM. The row stays open in case the next access is nearby.",{who:"cpu"});let o=0;for(let c of r)c.t0=o,o+=c.dur,c.t1=o;return{steps:r,total:o,tl:t}}var Sh=[["Display",["panel","lid","webcam","antenna","hinge"]],["Input",["keyboard","touchpad"]],["Chassis",["ccover","dcover"]],["Compute",["soc","gpu","vram"]],["Memory and storage",["ram","ssd"]],["Power",["battery","bms","pd","vrm"]],["Cooling",["fan","heatpipe","coldplate","heatsink"]],["Board and control",["board","ec","bios"]],["Connectivity",["wifi","port_usbc","port_usba","port_hdmi","port_audio"]],["Sound and cables",["speaker","cable_edp","cable_ant","cable_kb","cable_tp","cable_bat"]]],Vl=i=>i.toFixed(1),hi={soc:{name:"CPU (system on a chip)",group:"Compute",short:"CPU / SoC",summary:"The processor: runs the programs and talks to everything else.",does:"Executes instructions. It also holds the memory controller, the PCIe controller, the integrated graphics and the display engine, so one chip is the hub that every other major part connects to.",works:["A core fetches instructions, decodes them into micro-operations, runs them on execution units (adders, multipliers, load and store units) and retires the results. Modern cores run several instructions per clock and out of order, and guess branches ahead of time.","Most of the die is memory: small fast caches (L1 next to each core, L2, and a shared L3) keep recent data close, because a trip to DRAM costs hundreds of cycles. Data moves in 64-byte cache lines.","Switching a transistor costs energy, so dynamic power is roughly P = C\xB7V\xB2\xB7f. Higher clock needs higher voltage, so power climbs with about the cube of frequency. That is why a CPU that gets too hot slows itself down (thermal throttling)."],links:[["ram","DDR5 memory bus, two channels"],["ssd","PCIe lanes to the NVMe drive"],["gpu","PCIe lanes to the discrete GPU"],["wifi","PCIe (and USB for Bluetooth)"],["panel","eDP display output from the integrated GPU"],["ec","eSPI: power and keyboard events"],["bios","SPI: firmware fetch at reset"],["vrm","Voltage request out, core power in"],["coldplate","Heat out through the cold plate"]],specs:[["Package","BGA, soldered to the board","TYP"],["On the die","CPU cores, L3 cache, integrated GPU, memory controller, PCIe root complex, display engine","TYP"],["Cache line","64 bytes","TYP"],["Dynamic power","P \u2248 C\xB7V\xB2\xB7f","STD"],["Junction limit","about 100 \xB0C before throttling","TYP"],["Core and clock figures","not shown: this is not a specific product","ILL"]],inside:{cols:4,nodes:[["c","Cores + L1/L2",0,0,"a"],["l3","Shared L3",1,0],["mc","Memory controller",2,0],["dd","DDR5 bus",3,0],["ig","Integrated GPU",0,1],["de","Display engine",1,1],["pc","PCIe controller",2,1],["io","SSD, GPU, Wi-Fi",3,1]],edges:[["c","l3"],["l3","mc"],["mc","dd"],["ig","de"],["l3","ig"],["l3","pc"],["pc","io"]]},layers:"Package open: substrate, die, thermal paste, cold plate."},gpu:{name:"Discrete GPU",group:"Compute",short:"GPU",summary:"A second processor built for thousands of simple operations at once.",does:"Draws 3D graphics and runs highly parallel math. This reference machine has one next to the CPU; many thin laptops use only the integrated GPU inside the CPU instead.",works:["A GPU is many small cores grouped into blocks. Each block runs the same instruction on many pieces of data at once (pixels, vertices, matrix elements), which suits graphics and machine learning.","It has its own fast memory (VRAM) on a wide bus, because parallel work needs far more bandwidth than a CPU's DDR5. Here four GDDR6 chips make a 128-bit bus.","It is the biggest heat source when gaming, so it shares the cold plate and heat pipes with the CPU. In hybrid graphics the dGPU only wakes for heavy jobs and the display is still driven by the integrated GPU."],links:[["soc","PCIe link to the CPU"],["vram","GDDR6 bus to the four memory chips"],["vrm","Its own core voltage regulator"],["coldplate","Shares the cooling plate with the CPU"],["heatpipe","Heat leaves through the heat pipes"]],specs:[["Memory type","GDDR6, 32 bits per chip (two 16-bit channels)","STD"],["Bus width","4 chips \xD7 32 bits = 128 bits","TYP"],["Link to CPU","PCIe, 8 lanes","TYP"],["Board power class","tens of watts up to about 100 W in laptops","TYP"],["Load figures in this model","up to 80 W at full load","ILL"]],inside:{cols:4,nodes:[["sm","Shader blocks",0,0,"a"],["l2","L2 cache",1,0],["mc","Memory controller",2,0],["vr","GDDR6 VRAM",3,0],["rt","Raster + media",0,1],["pc","PCIe interface",2,1],["cpu","To the CPU",3,1]],edges:[["sm","l2"],["l2","mc"],["mc","vr"],["rt","sm"],["pc","cpu"],["l2","pc"]]}},vram:{name:"Graphics memory (GDDR6)",group:"Compute",short:"VRAM",summary:"Four memory chips that feed the GPU.",does:"Holds textures, frame buffers and model data for the GPU, with much more bandwidth than system RAM.",works:["Each chip has two 16-bit channels. The GPU reads and writes them in parallel across all four chips, so the effective bus is 128 bits wide.","Peak bandwidth is bus width \xD7 data rate \xF7 8. At an illustrative 14 Gbit/s per pin that is 128 \xD7 14 \xF7 8 = 224 GB/s, several times a DDR5 channel pair."],links:[["gpu","GDDR6 bus"]],specs:[["Chip width","32 bits (2 \xD7 16)","STD"],["Chips","4","TYP"],["Data rate","14 Gbit/s per pin, for the 224 GB/s example","ILL"]]},ram:{name:"RAM (DDR5 SO-DIMM)",group:"Memory and storage",short:"RAM",summary:"Working memory: where running programs and their data live.",does:"Stores everything the CPU is working on right now. It is fast but loses its contents when power goes off, so permanent data lives on the SSD.",works:["Each bit is a tiny capacitor plus a transistor. A capacitor leaks, so the chip refreshes every row many times a second.","To read, the controller first opens a row (ACT): the whole row is copied into sense amplifiers. Then a column read (RD) picks data from that row. Opening a different row first closes the old one (PRE). That is why access time depends on which row is open.",Vl(Nt.tCL)+" ns is the CAS latency at DDR5-4800 CL40: 40 clocks of 0.417 ns. One read bursts 16 transfers over a 32-bit sub-channel, which is exactly 64 bytes, one CPU cache line.","DDR5 puts the power regulator (PMIC) and a small identity chip (SPD hub) on the module itself. The module takes 5 V and makes its own 1.1 V."],links:[["soc","DDR5 bus: two 32-bit sub-channels per module"],["vrm","5 V in; PMIC makes 1.1 V on the module"],["bios","Firmware reads the SPD chip and trains the bus"],["ssd","Data is loaded here from the SSD"]],specs:[["Pins","262","STD"],["Module size","69.6 \xD7 30 mm","STD"],["Supply","VDD 1.1 V, VPP 1.8 V","STD"],["Burst","16 beats \xD7 32 bits = 64 B","STD"],["Speed grade","DDR5-4800 (2400 MHz clock): "+Vl(Nt.peakGBsModule)+" GB/s per 64-bit module","STD"],["Timings","CL"+Rt.cl+"-"+Rt.trcd+"-"+Rt.trp+" (JEDEC DDR5-4800B)","TYP"],["Capacity","commonly 8 to 32 GB per module; not set here","TYP"]],inside:{cols:4,nodes:[["ca","CA bus + clock",0,0],["dec","Row / column decode",1,0],["bank","Bank groups",2,0,"a"],["sa","Sense amps",3,0],["pmic","PMIC 5 V \u2192 1.1 V",0,1],["spd","SPD hub",1,1],["dq","DQ + DQS pins",3,1]],edges:[["ca","dec"],["dec","bank"],["bank","sa"],["sa","dq"],["pmic","bank"]]},layers:"Open up: DRAM chips lift off the module PCB."},ssd:{name:"SSD (M.2 NVMe)",group:"Memory and storage",short:"SSD",summary:"Permanent storage made of flash chips and a controller.",does:"Keeps your files, programs and the operating system when the power is off. When a program needs data, the SSD copies it into RAM.",works:["Data sits in NAND flash: transistors with a floating gate that holds charge. TLC flash stores 3 bits per cell by distinguishing 8 charge levels. Cells wear out with erase cycles, so the controller spreads writes evenly.","The controller maps the logical block addresses the OS uses to physical flash pages (the flash translation layer), corrects errors with ECC, and reads several flash dies in parallel on separate channels to reach high speed.","NVMe talks to the host through queues in RAM: the OS writes a 64-byte command into a submission queue and rings a doorbell register. The SSD fetches it, does the work, writes a 16-byte completion, and interrupts the CPU. The drive moves the data itself by DMA, with no CPU copying."],links:[["soc","PCIe 4.0 \xD7 4 lanes"],["ram","DMA: data lands in DRAM"],["vrm","3.3 V supply from the board"],["bios","Firmware reads the boot partition from here"]],specs:[["Form factor","M.2 2280: 22 \xD7 80 mm, M key","STD"],["Interface","NVMe over PCIe 4.0 \xD7 4: "+Vl(Ai.rawGBs)+" GB/s raw, about "+Vl(Ai.effGBs)+" GB/s after packet overhead","TYP"],["Queue entries","submission 64 B, completion 16 B","STD"],["Queues","up to 65,535 I/O queues of up to 65,536 commands","STD"],["Flash","TLC NAND, controller with LDPC ECC","TYP"],["Read latency used here","70 \xB5s for the flash read","ILL"]],inside:{cols:4,nodes:[["pcie","PCIe 4.0 \xD7 4",0,0],["ctl","Controller",1,0,"a"],["ftl","Address map (FTL)",1,1],["ch","NAND channels",2,0],["nand","NAND dies",3,0]],edges:[["pcie","ctl"],["ctl","ftl"],["ctl","ch"],["ch","nand"]]},layers:"Open up: shield, NAND package and controller separate from the PCB."},battery:{name:"Battery pack",group:"Power",short:"Battery",summary:"Three lithium-ion pouch cells in series.",does:"Stores energy as chemical potential and delivers it as current. It powers the laptop away from the wall and absorbs the extra when a charger is attached.",works:["Lithium ions move between a graphite anode and a metal-oxide cathode through a separator soaked in electrolyte. Charging pushes ions into the anode; discharging lets them flow back and the electrons take the outside circuit.","One cell sits between about 3.0 and 4.2 V. Three in series add up: roughly 9 to 12.6 V (11.1 V nominal). Energy is voltage \xD7 charge: a 60 Wh pack could, in principle, supply 60 W for an hour.","The pouch is thin and flat to fit the chassis. A protection board (BMS) watches each cell and cuts the pack off on over-voltage, under-voltage, over-current or high temperature."],links:[["bms","Protection board and fuel gauge"],["cable_bat","Cable to the board"],["pd","Charged through the charger stage"],["vrm","Feeds every rail through VSYS"]],specs:[["Chemistry","Li-ion / Li-polymer pouch cells","TYP"],["Series cells","3 (3S)","TYP"],["Cell voltage","3.0 to 4.2 V, 3.7 V nominal","TYP"],["Pack voltage","9.0 to 12.6 V","TYP"],["Capacity in this model",sn.battWh+" Wh","ILL"],["Carry-on limit","100 Wh without airline approval","STD"]],inside:{cols:4,nodes:[["c1","Cell 1",0,0,"a"],["c2","Cell 2",1,0,"a"],["c3","Cell 3",2,0,"a"],["bms","BMS",3,0],["gau","Fuel gauge (SMBus)",3,1],["out","To VSYS",2,1]],edges:[["c1","c2"],["c2","c3"],["c3","bms"],["bms","out"],["bms","gau"]]},layers:"Open up: cells separate."},bms:{name:"Battery management board",group:"Power",short:"BMS",summary:"Watches the pack and protects it.",does:"Measures cell voltages, current and temperature; balances the cells; opens a protection switch if something is unsafe; and tells the laptop how full the battery is.",works:["A protection IC compares each cell against limits and drives back-to-back MOSFET switches in series with the pack.","A fuel gauge integrates current over time (coulomb counting) and reports state of charge and temperature to the embedded controller over the Smart Battery interface (SMBus)."],links:[["battery","Wired to the cell tabs"],["cable_bat","Output cable"],["ec","SMBus: charge level, temperature"]],specs:[["Host interface","Smart Battery Data (SMBus)","STD"],["Protections","over/under voltage, over current, over temperature","TYP"]]},pd:{name:"USB-C power and charger",group:"Power",short:"PD + charger",summary:"Negotiates the charger voltage and manages charging.",does:"Talks to the charger over the USB-C CC wire to agree on a voltage and current, switches the adapter power in, and charges the battery.",works:["USB Power Delivery starts at 5 V. The charger lists what it can supply; the laptop picks one (here 20 V). The voltage only rises after the agreement.","The charger stage is a switching converter. It sets the system rail (VSYS) and decides whether the battery charges or helps: if the load exceeds what the adapter can give, the battery supplements the difference.","Charging follows constant current to about 80 %, then a falling current at constant voltage to protect the cells."],links:[["port_usbc","VBUS and CC from the connector"],["battery","Charges it, or draws on it"],["ec","Reports contract and battery state"],["vrm","VSYS feeds every regulator"]],specs:[["Voltages","5, 9, 15, 20 V (Standard Power Range)","STD"],["Max power","100 W at 20 V \xD7 5 A (60 W at 3 A)","STD"],["Extended range","up to 48 V, 240 W","STD"],["Charge limit here",sn.chargeMaxW+" W","ILL"]]},vrm:{name:"Voltage regulators (VRM)",group:"Power",short:"VRM",summary:"Turn the battery voltage into the low voltages the chips need.",does:"The CPU wants about 1 V at tens of amps, the memory 1.1 V, flash 3.3 V. Regulators convert VSYS to each, efficiently.",works:["A buck converter switches the input on and off thousands of times a second through an inductor. The duty cycle sets the output: V_out \u2248 D \xD7 V_in. Because the switches are either fully on or fully off, little power is lost as heat (often 85 to 95 % efficient).","The CPU rail is several phases in parallel, each running a different part of the cycle. The current splits between them and the ripple falls. The CPU tells the regulator what voltage it needs, many times a second.","Power is P = V \xD7 I. At 1 V and 40 A the CPU takes 40 W, which is why the rails use thick copper and many capacitors close to the chip."],links:[["battery","Input from VSYS"],["soc","Core voltage"],["gpu","GPU core voltage"],["ec","Enable and power-good signals"]],specs:[["Topology","multi-phase buck converter","TYP"],["Efficiency used","88 to 92 % per rail","ILL"],["Core voltage in this model","0.65 to 1.15 V","ILL"]],inside:{cols:4,nodes:[["in","VSYS in",0,0],["sw","Switches (MOSFET)",1,0,"a"],["l","Inductor",2,0],["out","Rail out",3,0],["pwm","PWM controller",1,1],["fb","Feedback + VID",3,1]],edges:[["in","sw"],["sw","l"],["l","out"],["pwm","sw"],["out","fb"],["fb","pwm"]]}},fan:{name:"Cooling fan (blower)",group:"Cooling",short:"Fan",summary:"Pulls cool air in and pushes it through the fins.",does:"Moves air across the heat sink fins and out of the chassis. Without airflow the fins would only warm up.",works:["A centrifugal blower pulls air in along the axis through vents in the bottom cover, flings it outward with curved blades and sends it out of a single outlet. That makes high pressure in a thin package, which is what the narrow fins need.","A brushless motor spins the impeller. The EC sets the speed with a PWM signal and reads it back from a tach wire.","Fan laws: airflow rises with speed, pressure with speed squared and power with speed cubed. Doubling the speed doubles the air but costs eight times the power and much more noise."],links:[["heatsink","Blows through the fin stack"],["ec","PWM control and tach signal"],["dcover","Draws air through the bottom vents"],["board","Powered and connected through the board"]],specs:[["Type","centrifugal blower with BLDC motor","TYP"],["Control","4-wire fan: 25 kHz PWM and tach","STD"],["Max speed","6400 rpm","ILL"],["Airflow at max","9 CFM per fan","ILL"],["Scaling","flow \u221D rpm, pressure \u221D rpm\xB2, power \u221D rpm\xB3","STD"]],inside:{cols:4,nodes:[["in","Axial intake",0,0],["imp","Impeller blades",1,0,"a"],["vol","Volute housing",2,0],["out","Outlet to fins",3,0],["mot","BLDC motor",1,1],["ctl","PWM from EC",0,1]],edges:[["in","imp"],["imp","vol"],["vol","out"],["mot","imp"],["ctl","mot"]]},layers:"Open up: cover, impeller and housing separate."},heatpipe:{name:"Heat pipes",group:"Cooling",short:"Heat pipe",summary:"Sealed tubes that carry heat far faster than solid copper.",does:"Move heat from the CPU and GPU, where it is made, to the fin stacks at the fans, where the air can take it.",works:["A heat pipe is a sealed, flattened copper tube with a little water inside at low pressure and a porous wick on the wall. Low pressure lets water boil well below 100 \xB0C.","At the hot end the water evaporates and absorbs a lot of heat (2.26 MJ per kg at 100 \xB0C). The vapour rushes to the cold end, condenses and gives the heat back. The wick draws the liquid back to the hot end by capillary action.","The cycle runs on temperature difference alone, with no moving parts. A heat pipe conducts heat many times better than a solid copper rod of the same size."],links:[["coldplate","Soldered on top of the cold plate"],["heatsink","Pass through the fin stacks"],["soc","Collect its heat"],["gpu","Collect its heat"]],specs:[["Working fluid","water in a sealed copper tube","TYP"],["Latent heat of water","\u2248 2.26 MJ/kg at 100 \xB0C","STD"],["Thickness when flattened","about 2 to 3 mm","TYP"],["Resistances used","lumped values in the thermal model","ILL"]],inside:{cols:4,nodes:[["ev","Evaporator (hot end)",0,0,"a"],["va","Vapour flows \u2192",1,0],["co","Condenser (cold end)",2,0],["wi","Wick returns liquid \u2190",1,1]],edges:[["ev","va"],["va","co"],["co","wi"],["wi","ev"]]}},coldplate:{name:"Cold plate",group:"Cooling",short:"Cold plate",summary:"A copper plate pressed on the chips.",does:"Collects heat from the CPU and GPU dies and hands it to the heat pipes. Thermal paste fills the microscopic gaps between chip and plate.",works:["Spring screws press the plate onto the dies at a set force. A thin layer of thermal paste or a pad replaces trapped air (a poor conductor) with something that conducts.","Copper conducts heat well (about 400 W/m\xB7K). The plate spreads the heat sideways so the pipes can take it from a wide area."],links:[["soc","Presses on the die"],["gpu","Presses on the die"],["heatpipe","Pipes are soldered on top"]],specs:[["Material","copper","TYP"],["Conductivity of copper","\u2248 400 W/(m\xB7K)","STD"],["Interface","thermal paste or pad","TYP"]]},heatsink:{name:"Heat sink fins",group:"Cooling",short:"Fins",summary:"Many thin plates that give the air a large surface to cool.",does:"Pass heat from the pipes to the air flowing through them and out of the machine.",works:["Heat leaves a surface in proportion to its area. Dozens of thin fins spaced about a millimetre apart give far more area than a block would, in the same space.","The fan forces air through the gaps. Faster air thins the stagnant boundary layer on each fin, which lowers the thermal resistance. The air leaves warmer by \u0394T = Q \xF7 (\u03C1\xB7V\u0307\xB7c_p)."],links:[["heatpipe","Pipes run through them"],["fan","Air is pushed through"],["dcover","Hot air exits at the rear"]],specs:[["Fin count","44 per stack","ILL"],["Fin pitch","about 1.35 mm","ILL"],["Air properties","density 1.2 kg/m\xB3, specific heat 1005 J/(kg\xB7K)","STD"]],layers:"Open up: fins spread apart."},board:{name:"Motherboard (PCB)",group:"Board and control",short:"Motherboard",summary:"The circuit board that every chip is soldered to.",does:"Holds the chips and connects them with copper traces, power planes and connectors.",works:["A multi-layer sandwich of fibreglass epoxy (FR-4) and thin copper. Signal layers carry traces; whole layers carry ground and power. Tiny drilled holes called vias connect the layers.","The fast buses are routed with care: DDR5 lines are length-matched to a fraction of a millimetre so all bits arrive together, and PCIe pairs are routed as differential pairs with controlled impedance.","The CPU, GPU and memory chips are BGA parts: a grid of solder balls underneath, reflow-soldered in an oven."],links:[["soc","Holds"],["gpu","Holds"],["ram","Slots"],["ssd","M.2 socket"],["wifi","M.2 socket"]],specs:[["Substrate","FR-4 fibreglass epoxy with copper layers","STD"],["Layers","typically 8 to 12 in a laptop","TYP"],["Fast-pair impedance","about 85 to 100 \u03A9 differential for PCIe","TYP"],["Layout shown","illustrative, not a real product's routing","ILL"]]},ec:{name:"Embedded controller (EC)",group:"Board and control",short:"EC",summary:"A small always-on computer that manages the laptop.",does:"Reads the keyboard and power button, talks to the battery, runs the fans and watches temperatures, even when the main processor is off.",works:["It is a microcontroller with its own firmware. It runs from the always-on rail, so it can wake the system on the power button.","It scans the keyboard matrix, reads thermal sensors and sets fan speed by a temperature policy, talks to the battery gauge over SMBus, and sequences the power rails during boot."],links:[["keyboard","Scans the key matrix"],["fan","PWM and tach"],["battery","SMBus gauge"],["soc","eSPI link to the CPU"],["pd","Charger and PD status"]],specs:[["Role","power sequencing, keyboard, fans, battery","TYP"],["Link to CPU","eSPI","STD"],["Power","always-on rail","TYP"]]},bios:{name:"Firmware flash (UEFI)",group:"Board and control",short:"Firmware",summary:"The chip that holds the first program the CPU runs.",does:"Stores the UEFI firmware. At reset the CPU reads its very first instruction from here.",works:["An x86 CPU fetches from the reset vector 0xFFFFFFF0. The chipset maps the top of the 4 GiB address space onto this SPI flash chip, so the firmware starts running with no RAM at all.","UEFI runs in phases: SEC, PEI (starts the memory), DXE (drivers), BDS (picks the boot device). It also keeps settings and Secure Boot keys here."],links:[["soc","SPI bus"],["ec","May be read or updated through the EC"],["ssd","Finds the boot partition there"]],specs:[["Type","SPI NOR flash, 8-pin package","TYP"],["Reset vector","0xFFFFFFF0 (x86)","STD"],["Firmware","UEFI, with Secure Boot","STD"]]},wifi:{name:"Wi-Fi module",group:"Connectivity",short:"Wi-Fi",summary:"A radio on a small plug-in card.",does:"Sends and receives data by radio in the 2.4, 5 and 6 GHz bands, and carries Bluetooth.",works:["Bits are mapped onto many closely spaced subcarriers (OFDM) and sent as radio waves. The card uses two antennas, so it can send two streams at once (2\xD72 MIMO).","Radio only works well when the antennas are not surrounded by metal. That is why the antennas sit at the top of the display lid, away from the metal base, and thin coax cables run to them through the hinges."],links:[["antenna","Two coax cables to the antennas"],["cable_ant","MHF4 coax"],["soc","PCIe (and USB for Bluetooth)"]],specs:[["Form factor","M.2 2230, Key E","STD"],["Bands","2.4, 5 and 6 GHz (Wi-Fi 6E class)","TYP"],["Antennas","2","TYP"],["Connectors","MHF4 / U.FL micro coax","TYP"]],inside:{cols:4,nodes:[["mac","MAC + baseband",0,0,"a"],["rf","RF front end",1,0],["pa","Amps + filters",2,0],["ant","2 antennas",3,0],["pc","PCIe / USB",0,1]],edges:[["pc","mac"],["mac","rf"],["rf","pa"],["pa","ant"]]}},port_usbc:{name:"USB-C ports",group:"Connectivity",short:"USB-C",summary:"The reversible port that carries data, video and charging.",does:"Connects to chargers, drives, docks and displays. One of the two ports is the main charging input.",works:["The 24-pin connector has two copies of the signal pins, so it works either way up. The CC pin tells each side which way it was plugged in and carries the Power Delivery messages.","The high-speed pairs can carry USB or DisplayPort video (alternate mode)."],links:[["pd","VBUS and CC go to the PD controller"],["soc","Data lines"]],specs:[["Pins","24, reversible","STD"],["Power","up to 100 W (SPR) or 240 W (EPR)","STD"],["Alternate modes","DisplayPort video","STD"]]},port_usba:{name:"USB-A ports",group:"Connectivity",short:"USB-A",summary:"The classic rectangular USB port.",does:"Connects mice, drives and other older USB devices.",works:["Four contacts for USB 2.0 (power, ground and a differential pair) plus five more for USB 3 SuperSpeed. The host supplies 5 V."],links:[["soc","USB controller"]],specs:[["Supply","5 V, up to 900 mA for USB 3.x","STD"],["Contacts","9 (USB 3)","STD"]]},port_hdmi:{name:"HDMI port",group:"Connectivity",short:"HDMI",summary:"Sends video and sound to a TV or monitor.",does:"A digital output for an external display.",works:["The graphics output is serialised on differential pairs (TMDS, or FRL on newer versions) with a clock, and an I\xB2C channel lets the display describe its own capabilities (EDID)."],links:[["gpu","Video source"],["soc","Video source"]],specs:[["Connector","Type A, 19 pins","STD"]]},port_audio:{name:"Headset jack",group:"Connectivity",short:"Audio",summary:"3.5 mm combined headphone and microphone socket.",does:"Plays sound to headphones and takes sound from a headset microphone.",works:["Four contacts on the plug: left, right, ground, microphone. A codec chip converts digital audio to analogue (DAC) and microphone input back to digital (ADC)."],links:[["soc","Audio via the codec"],["speaker","Muted when a plug is inserted"]],specs:[["Plug","3.5 mm TRRS","STD"]]},panel:{name:"Display panel",group:"Display",short:"Display",summary:"A liquid-crystal screen with an LED backlight.",does:"Shows the picture. The graphics output arrives over a thin cable as a digital video stream and is turned into light, pixel by pixel.",works:["An LED strip at the edge lights a light guide plate, which spreads the light behind the screen. Sheets even it out.","In front of it, a layer of liquid crystal sits between two crossed polarisers. A voltage on each sub-pixel twists the crystals, which changes how much light gets through. Red, green and blue filters turn that into colour.","A timing controller on the panel receives the stream over embedded DisplayPort (eDP) and drives the rows and columns."],links:[["cable_edp","eDP video and backlight power"],["soc","Video source (integrated GPU)"],["webcam","Sits in the bezel above it"]],specs:[["Diagonal","14 inch","TYP"],["Aspect","16:10 \u2192 active area "+Gt.w.toFixed(1)+" \xD7 "+Gt.h.toFixed(1)+" mm","STD"],["Interface","embedded DisplayPort (eDP)","STD"],["Technology","IPS LCD with edge LED backlight","TYP"],["Resolution, refresh","1920 \xD7 1200 at 60 Hz used for the picture","ILL"]],inside:{cols:4,nodes:[["edp","eDP in",0,0],["tcon","Timing controller",1,0,"a"],["drv","Row + column drivers",2,0],["lcd","LCD cell",3,0],["led","LED backlight",3,1]],edges:[["edp","tcon"],["tcon","drv"],["drv","lcd"],["led","lcd"]]},layers:"Open up: cover glass, LCD cell, light guide and reflector separate."},lid:{name:"Lid and bezel",group:"Display",short:"Lid",summary:"The shell around the display.",does:"Protects the panel, holds the camera, microphones and antennas, and ties the display to the hinges.",works:["The outer cover is thin aluminium or magnesium alloy for stiffness. The front frame (bezel) is plastic around the panel. The lid has to resist twisting, because the hinges only hold it at the bottom corners."],links:[["panel","Encloses"],["hinge","Attached at the bottom corners"],["antenna","Antennas inside the top edge"]],specs:[["Material","aluminium or magnesium alloy","TYP"]]},webcam:{name:"Camera module",group:"Display",short:"Camera",summary:"A tiny camera in the top bezel.",does:"Captures video for calls. A small LED lights when it is in use.",works:["A lens focuses light onto a CMOS image sensor. It sends frames to the CPU over USB 2.0 using the standard video class (UVC), so no special driver is needed. A pair of microphones sit beside it."],links:[["cable_edp","Shares the display cable bundle"],["soc","USB 2.0 (UVC)"]],specs:[["Interface","USB 2.0, UVC","STD"],["Sensor","CMOS, 720p to 1080p class","TYP"]]},antenna:{name:"Antennas",group:"Display",short:"Antennas",summary:"Two thin metal strips in the top of the lid.",does:"Send and receive the Wi-Fi and Bluetooth signal.",works:["A strip of metal cut to roughly a quarter to a half of a wavelength (a wavelength is about 12 cm at 2.4 GHz) resonates and radiates. Placing it at the top edge, far from the metal chassis and the screen, keeps the radio signal strong."],links:[["wifi","Thin coax down through the hinge"],["cable_ant","The coax"]],specs:[["Count","2","TYP"]]},hinge:{name:"Hinges",group:"Display",short:"Hinge",summary:"Friction hinges that hold the lid at any angle.",does:"Let the lid open and hold it, and carry the display cable and antenna cables across the joint.",works:["Each hinge is a metal shaft with a clutch: tight springs press friction plates together so the lid stays where you leave it. Cables are routed through the hollow barrel so they flex rather than kink."],links:[["lid","Attached to"],["dcover","Attached to"],["cable_edp","Carries the display cable"]],specs:[["Type","friction torque hinge","TYP"]]},keyboard:{name:"Keyboard",group:"Input",short:"Keyboard",summary:"About 80 keys scanned as a grid.",does:"Turns key presses into signals for the embedded controller.",works:["Each key sits on a scissor mechanism over a rubber dome. Pressing it collapses the dome and closes a contact on a thin membrane sheet below.","Keys are wired as a matrix of rows and columns. The controller drives one row at a time and reads which columns are connected, hundreds of times per second, so 80 keys need only about 26 wires (for example 8 rows by 18 columns).","A white LED sheet lights the keys from underneath."],links:[["cable_kb","Flat ribbon cable to the board"],["ec","Matrix scanning"],["ccover","Sits in the top deck"]],specs:[["Key pitch","19.05 mm","STD"],["Mechanism","scissor switch with rubber dome","TYP"],["Layout","15 units wide, six rows","TYP"]],inside:{cols:4,nodes:[["kc","Keycap",0,0,"a"],["sc","Scissor",1,0],["dm","Dome + membrane",2,0],["mx","Row/column matrix",3,0],["ec","EC scans it",3,1]],edges:[["kc","sc"],["sc","dm"],["dm","mx"],["mx","ec"]]},layers:"Open up: keycaps, membrane and back plate separate."},touchpad:{name:"Touchpad",group:"Input",short:"Touchpad",summary:"A glass surface that senses fingers by capacitance.",does:"Tracks one or more fingers and reports movements and clicks.",works:["Under the glass is a grid of electrodes. A finger changes the capacitance where it touches, and the controller finds its position from the pattern, down to a fraction of a millimetre. It reports to the CPU as a standard HID device over I\xB2C."],links:[["cable_tp","Flat ribbon cable to the board"],["soc","I\xB2C-HID"]],specs:[["Sensing","mutual capacitance","TYP"],["Bus","HID over I\xB2C","STD"]]},ccover:{name:"Top case (C cover)",group:"Chassis",short:"Top case",summary:"The deck around the keyboard and touchpad.",does:"Frames the keyboard and touchpad, and rests under your palms.",works:["A thin aluminium or magnesium sheet with cut-outs for the keyboard and touchpad. Slots above the speakers let the sound out."],links:[["keyboard","Holds"],["touchpad","Holds"],["speaker","Grilles above it"]],specs:[["Material","aluminium or magnesium alloy","TYP"],["Outline","315 \xD7 220 mm","TYP"]]},dcover:{name:"Bottom cover (D cover)",group:"Chassis",short:"Bottom cover",summary:"The base: floor, walls, vents and feet.",does:"Carries everything. Vents under the fans let cold air in, and slots at the rear let hot air out.",works:["A tray with a flat floor and walls. Screws in the corners hold the top case. The rubber feet raise the base so air can reach the intake vents."],links:[["fan","Intake vents under the fans"],["heatsink","Exhaust at the rear"],["battery","Holds"]],specs:[["Thickness","about 15 mm in total","TYP"]]},speaker:{name:"Speakers",group:"Sound and cables",short:"Speaker",summary:"A pair of small loudspeakers.",does:"Turns the audio signal into sound.",works:["A voice coil sits in a magnet's field. The signal current makes the coil push a paper or plastic cone back and forth, which moves air. A class-D amplifier on the board drives the coil."],links:[["board","Driven by an amplifier on the board"],["ccover","Sound exits through the grilles"]],specs:[["Type","moving-coil driver","TYP"]]},cable_edp:{name:"Display cable (eDP)",group:"Sound and cables",short:"Display cable",summary:"A thin micro-coax bundle that carries the picture to the lid.",does:"Brings the video signal, backlight power and the camera lines up through the hinge to the panel.",works:["The video travels as a few high-speed differential pairs, each made from a fine coax so the signal is not corrupted by the hinge's bending. The same bundle carries power for the LED backlight and the camera's USB lines."],links:[["panel","Plugs into the panel"],["soc","Plugs into the board"],["hinge","Passes through"]],specs:[["Standard","embedded DisplayPort","STD"],["Lanes","1, 2 or 4 differential pairs","STD"]]},cable_ant:{name:"Antenna cables",group:"Sound and cables",short:"Antenna coax",summary:"Two micro-coax cables from the Wi-Fi card to the lid.",does:"Carry the radio signal between the card and the antennas.",works:["A centre conductor inside a shield, so the signal is not lost or picked up along the way. They snap on to the card with tiny MHF4 connectors."],links:[["wifi","Plug into the card"],["antenna","End in the lid"]],specs:[["Connector","MHF4 / U.FL","TYP"],["Impedance","50 \u03A9","STD"]]},cable_kb:{name:"Keyboard ribbon",group:"Sound and cables",short:"Keyboard FFC",summary:"A flat flexible cable.",does:"Carries the key matrix wires and the backlight supply to the board.",works:["Copper traces printed on a thin plastic film, with a latch connector on the board."],links:[["keyboard","Source"],["ec","Scans it"]],specs:[["Type","flat flexible cable (FFC)","TYP"]]},cable_tp:{name:"Touchpad ribbon",group:"Sound and cables",short:"Touchpad FFC",summary:"A short flat cable.",does:"Carries the touchpad's I\xB2C bus and power.",works:["A short flat flexible cable from the touchpad sensor to the board."],links:[["touchpad","Source"],["soc","I\xB2C"]],specs:[["Type","flat flexible cable","TYP"]]},cable_bat:{name:"Battery cable",group:"Sound and cables",short:"Battery cable",summary:"The heavy leads from the battery to the board.",does:"Carries the pack's power and the gauge's communication lines.",works:["Thick wires for power (tens of amps flow through them at full load) and thin ones for the SMBus gauge."],links:[["battery","Source"],["pd","VSYS node"]],specs:[["Current","about 10 A at the full-load example","ILL"]]}},N1=Sh.flatMap(([,i])=>i);var pe={ink:"#16181b",mute:"#6a7078",faint:"#c4c8cd",line:"#dfe2e6",panel:"rgba(250,250,251,.95)",red:"#e5342b",blue:"#2f7de1",green:"#1f9d62",amber:"#d98a00",violet:"#7a5af0",teal:"#139e92",orange:"#f26a1b"},fa=[["explore","EXPLORE"],["power","POWER FLOW"],["memory","CPU \u2194 RAM"],["storage","SSD \u2192 RAM"],["cpu","CPU EXECUTES"],["thermal","COOLING"],["boot","BOOT"]],tv=i=>`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${i};margin-right:7px;vertical-align:-1px"></i>`,ua=i=>`<p>${i.map(([e,t])=>`${tv(e)}${t}`).join("<br>")}</p>`,nv={power:["Follow the energy",`<p>Charger power enters at <b>20 V</b>, becomes the system rail <b>VSYS</b>, and is stepped down by regulators next to each chip. Power is voltage \xD7 current, so the same watts at about 1 V are tens of amps: look at the CPU rail.</p>${ua([["#ff9d1c","20 V from the charger"],["#ff7a18","VSYS, the battery voltage"],["#f2c230","5 V (fans, DIMM input)"],["#19b8d4","3.3 V (SSD, Wi-Fi)"],["#ff4b6e","CPU and GPU core, about 1 V"],["#3ddc84","DDR5 memory, 1.1 V"]])}<p>Try <b>Gaming</b> with the <b>60 W</b> charger: the battery has to add the rest. Switch to <b>None</b> and the pack supplies everything.</p><p style="color:${pe.mute}">Adapter + battery = system + charger loss, always. Load and efficiency figures are illustrative.</p>`],memory:["One trip to memory",`<p>A load that misses every cache goes to DRAM. The memory controller sends <b>commands</b> on a small bus, waits for the DRAM array, then <b>16 data transfers</b> come back on 32 wires: exactly 64 bytes, one cache line.</p>${ua([["#2f7de1","command / address packet"],["#1f9d62","read data coming back"],["#f26a1b","write data going out"]])}<p>The timing diagram uses the real DDR5-4800 numbers. The wait is mostly <b>tRP + tRCD + CL</b>: opening a row is the expensive part. Choose <b>Row open</b> to see a row hit.</p><p style="color:${pe.mute}">The animation is slowed by a billion; the clock counts are real. Timings are the JEDEC DDR5-4800B grade.</p>`],storage:["A file read, end to end",`<p>The CPU never copies the file. It leaves a 64-byte request in RAM, rings a doorbell, and the SSD does the rest: it looks up the flash page, reads and error-corrects it, then <b>pushes the data into RAM</b> over PCIe by DMA.</p>${ua([["#7a5af0","PCIe lanes to the SSD"],["#2f7de1","command in RAM"],["#1f9d62","file data on its way to DRAM"],["#e5342b","interrupt: it is done"]])}<p>Compare <b>4 KiB</b> with <b>1 GiB</b>: the small read is all latency, the big one is all bandwidth.</p><p style="color:${pe.mute}">Stage times come from the model. The flash read time is illustrative.</p>`],cpu:["Five stages, one clock",`<p>An instruction is <b>fetched</b>, <b>decoded</b>, <b>executed</b>, may touch <b>memory</b>, and is <b>written back</b>. While one executes, the next is already decoding: a pipeline.</p><p>The program adds four numbers from RAM. Watch for three things: a <b>load miss</b> that stalls the line for many cycles, a <b>load-use hazard</b>, and a <b>mispredicted branch</b> at the end of the loop.</p><p style="color:${pe.mute}">A teaching model. Real cores run several instructions per cycle, out of order, with large branch predictors. The cache miss is shortened to 16 cycles for display.</p>`],thermal:["Where the heat goes",`<p>Nearly every watt becomes heat. The <b>cold plate</b> collects it from the CPU and GPU, <b>heat pipes</b> carry it to the <b>fins</b>, and the <b>fans</b> push air through.</p>${ua([["#ff5a2a","steam carrying heat in the pipe"],["#3b9bff","liquid returning (and cool air in)"],["#ff9a52","warm exhaust air"]])}<p>Parts are tinted by temperature. Choose <b>Stress</b> and speed the clock up: the fans climb, and at the limit the chips slow themselves down.</p><p style="color:${pe.mute}">A lumped thermal model with illustrative parameters. Fan rotation is slowed on screen.</p>`],boot:["Power button to desktop",`<p>The order is fixed by the hardware: a tiny always-on controller wakes first, the power rails come up in sequence, the CPU reads firmware from a flash chip, the firmware trains the memory, finds the devices and the boot disk, and hands over to the operating system.</p>${ua([["#ff9d1c","rails that are up"],["#7a5af0","PCIe enumeration"],["#1f9d62","kernel loaded from SSD to RAM"]])}<p>Click a step in the strip to jump to it.</p><p style="color:${pe.mute}">The sequence follows the x86 platform and UEFI phases; the durations are stretched for readability.</p>`]},iv=[["does","FUNCTION"],["works","HOW IT WORKS"],["links","CONNECTIONS"],["specs","SPECS"]],sv=`
#app{font-family:Inter,system-ui,sans-serif;color:${pe.ink};-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ui{position:absolute;inset:0;pointer-events:none}
.ui *{box-sizing:border-box}
.pn{position:absolute;background:${pe.panel};border:1px solid ${pe.line};box-shadow:0 1px 3px rgba(20,22,26,.06);pointer-events:auto}
.mono{font-family:'JetBrains Mono',monospace}
.lcap{font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:${pe.mute};white-space:nowrap}
.b{font-weight:700}
.btn{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border:1px solid ${pe.line};background:#fff;color:${pe.ink};font:600 10.5px Inter,sans-serif;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap;user-select:none}
.btn:hover{background:#f2f3f5}
.btn.on{background:${pe.ink};color:#fff;border-color:${pe.ink}}
.btn.red{background:${pe.red};color:#fff;border-color:${pe.red}}
.btn.sm{height:22px;padding:0 7px;font-size:9.5px}
.btn.dis{opacity:.4;pointer-events:none}
.chip{display:inline-block;padding:1px 5px;font:700 8.5px 'JetBrains Mono',monospace;letter-spacing:.6px;color:#fff;vertical-align:middle}
.chip.STD{background:${pe.green}}.chip.TYP{background:${pe.amber}}.chip.ILL{background:${pe.violet}}
.tabs{position:absolute;left:322px;top:14px;width:930px;display:flex;gap:4px;pointer-events:auto}
.tabs .btn{flex:1;height:32px;font-size:11px;letter-spacing:1.1px}
.ttl{position:absolute;left:20px;top:14px;pointer-events:none}
.ttl .tbar{width:36px;height:3px;background:${pe.red};margin-bottom:7px}
.ttl h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.ttl h1 span{color:${pe.red}}
.ttl p{margin:5px 0 0;font-size:9.5px;font-weight:600;letter-spacing:1.2px;color:${pe.mute};text-transform:uppercase;line-height:1.5}
.list{left:16px;top:92px;width:292px;height:792px;overflow:auto;padding:8px 0 10px}
.list::-webkit-scrollbar,.scr::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb,.scr::-webkit-scrollbar-thumb{background:#cfd3d8}
.list .g{padding:9px 14px 4px}
.list .it{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;font-size:12.5px;font-weight:500;border-left:3px solid transparent}
.list .it:hover{background:#f1f2f4}
.list .it.sel{background:#f4e9e8;border-left-color:${pe.red};font-weight:700}
.list .it i{display:block;width:6px;height:6px;border-radius:50%;background:${pe.faint};flex:none}
.list .it.sel i{background:${pe.red}}
.insp{left:1268px;top:84px;width:316px;height:800px;display:flex;flex-direction:column}
.insp .head{padding:14px 16px 8px;border-bottom:1px solid ${pe.line}}
.insp h2{margin:3px 0 4px;font-size:19px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
.insp .sum{font-size:12.5px;line-height:1.45;color:#3a3f46}
.insp .live{padding:8px 16px;border-bottom:1px solid ${pe.line};background:#f4f5f7;font-size:11.5px;line-height:1.5}
.insp .tb{display:flex;border-bottom:1px solid ${pe.line}}
.insp .tb div{flex:auto;text-align:center;padding:8px 4px;font-size:8.6px;font-weight:700;letter-spacing:.4px;white-space:nowrap;color:${pe.mute};cursor:pointer;border-bottom:2px solid transparent}
.insp .tb div.on{color:${pe.ink};border-bottom-color:${pe.red}}

.insp .inst{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dock{left:322px;top:552px;width:930px;height:266px;padding:12px 16px}
.dock h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.2px;display:inline}
.dock .chip{margin-left:7px}
.dock .lsub{font-size:11.5px;color:${pe.mute};margin-left:10px}

.bar2{height:7px;background:#e5e7ea;position:relative}

.note{font-size:11.5px;line-height:1.5;color:#2c3036}

.callout small{display:block;font:500 9px 'JetBrains Mono',monospace;color:${pe.mute};letter-spacing:.3px}
.tip{position:absolute;pointer-events:none;padding:4px 8px;background:${pe.ink};color:#fff;font:600 11px Inter,sans-serif;white-space:nowrap;transform:translate(12px,12px)}

.flash{animation:fl .7s ease-out}

.regs div.ch{background:#fde3e1;border-color:#e99a95}
.regs div b{color:${pe.mute};font-size:9px;display:block}
