/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

 phone small. Each block is a hard-wired specialist that does its job for far less energy than a general CPU could.",how:["Its CPU cores fetch, decode and execute instructions; small fast caches keep recent data close. The GPU runs thousands of small threads in parallel for graphics. The modem turns radio samples into data. The ISP turns raw sensor data into a photo.","The memory sits in a separate package right next to it (see Memory). The SoC has a memory controller and a storage controller to reach it, and a display controller that streams pixels to the panel.","Power and clock are scaled per block (DVFS): idle blocks are switched off, busy ones run faster, so battery and heat stay in budget."],links:[["memory","LPDDR4X bus and UFS storage lanes"],["pmic","Receives many supply rails, one per block"],["rf","RF transceiver and front-end modules (radio)"],["wifi","Wi-Fi and Bluetooth chip"],["audio","Audio codec"],["camera","Camera sensor interfaces"],["display","Display interface"],["thermal","Heat leaves through foil and copper"]],fails:"A failed or cracked solder ball (BGA) gives boot loops, random reboots or no boot. Overheating makes the OS slow the clocks (thermal throttling) first. Real SoC failure is rare and shows as a dead phone.",concepts:[["Computer architecture","Pipelines, caches, big.LITTLE-style clusters, memory hierarchy, DVFS"],["Operating systems","Scheduler (which core runs a thread), thermal governor, interrupts"],["Electronics","Power domains, clock gating, BGA packaging"],["Networking","The modem implements the radio protocol stack"]],qa:[["Why do phones throttle?","Power rises faster than clock (P \u2248 C\xB7V\xB2\xB7f, and V rises with f). With no fan, the heat has nowhere to go, so the governor lowers frequency to stay under the temperature limit."],["Why are there fast and slow cores?","Many tasks need little performance. Small cores do them at a fraction of the energy; big cores wake only for bursts."]],example:"Open a heavy web page and watch the clock jump up for a second, then fall back: the governor spending a burst of performance, then saving battery.",specs:[["Part","Qualcomm SDM765 / SM7250 (package marking SM7250)","TD"],["GPU","Adreno 620 (iFixit lists it with the 765G)","TD"],["Package size on the board","\u2248 11 \xD7 12 mm","APX"],["Process, core layout, clocks","not stated in the teardown","UNK"]],yours:["Snapdragon 695 5G with Adreno 619 (documented). Core types and 6 nm node are third-party. Different chip: a Snapdragon 6-series part with a built-in X51-class 5G modem (3RD).","DOC"]}),memory:pt({name:"Samsung memory + storage chip",short:"RAM + UFS",group:"Compute",summary:"One package holding the working memory (LPDDR4X) and the flash storage (UFS).",what:"The RAM holds what is running right now. The storage holds your apps and files when the power is off. Samsung stacks both in one multi-chip package (marking KM8V8001JM).",why:"Stacking saves board area and shortens the memory wires, which allows high speed at low power. The phone has no memory slots: it is soldered, and cannot be upgraded.",how:["DRAM stores each bit as charge in a tiny capacitor that leaks, so it is refreshed constantly. Opening a row, then reading a column, is the same idea as in a laptop DIMM.","UFS (Universal Flash Storage) is a serial interface to NAND flash. Commands are queued, so many reads can be in flight at once; the controller maps logical blocks to flash pages and corrects errors.","Flash wears out with erase cycles; the controller spreads writes evenly (wear levelling)."],links:[["soc","Memory controller and storage controller"],["pmic","Supply rails for the memory"],["thermal","Shares the heat path with the SoC"]],fails:"Weak flash gives read errors, apps crashing, slow storage and corrupted files. A broken memory joint gives random crashes or boot loops. Neither can be repaired by hand.",concepts:[["Computer architecture","Memory hierarchy, row/column access, latency vs bandwidth"],["Operating systems","Paging, page cache, swap, the low-memory killer, file systems, TRIM"],["Electronics","Package-on-package, signal integrity"],["Networking","UFS is a layered serial protocol (like a small network stack)"]],qa:[["Why is RAM fast but storage slow?","DRAM is accessed in tens of nanoseconds; flash reads take tens of microseconds. The OS hides this with a page cache in RAM."],["What happens when RAM is full on Android?","It cannot swap to flash much, so it kills background apps (the low-memory killer)."]],example:"An app you left a few minutes ago restarts from scratch instead of resuming: it was killed to free RAM.",specs:[["Part","Samsung MCP, KM8V8001JM marking","TD"],["Contents","128 GB UFS 2.1 + 8 GB LPDDR4X","TD"],["Position on the board","beside the SoC","APX"]],yours:["8 GB LPDDR4X with 128 GB or 256 GB UFS 2.2 (documented for the global 256 GB model; 128 GB is third-party). UFS 2.2 vs the reference 2.1.","DOC"]}),pmic:pt({name:"Power management chips (PM7250, PM7150A, PM7250B)",short:"PMICs",group:"Power",summary:"Turn the battery voltage into the many exact voltages the chips need, and manage charging.",what:"Three Qualcomm power-management chips sit on the rear side of the board. They create supply rails, switch them on in order, monitor the battery and handle charging.",why:"The battery is 3.8 to 4.4 V; the CPU core wants 0.5 to 1 V, the memory 1.1 V, the radio something else. Efficient conversion saves battery. Separate rails let unused blocks be switched off.",how:["Buck converters switch the input on and off many thousands of times a second through an inductor; the on-time fraction sets the output. Low-dropout regulators (LDOs) give very clean, quiet rails for radio and audio.","The SoC asks the PMIC for a voltage over a serial bus; the PMIC changes it in small steps (this is what DVFS needs).","The charging path limits current and temperature and tells the phone how full the battery is."],links:[["battery","Takes power from it, and charges it"],["usbc","Charger input"],["soc","Supplies and commands"],["memory","Supplies"],["rf","Supplies, with the envelope tracker"]],fails:"Dead PMIC: phone will not turn on or charge. A shorted rail: very hot spot and a fast-draining battery. These are classic board-repair faults.",concepts:[["Computer architecture","Power domains, DVFS voltage steps"],["Operating systems","Suspend and resume, wakelocks, power policy"],["Electronics","Buck converters, LDOs, power sequencing, efficiency"],["Networking","Envelope tracking: supply follows radio amplitude"]],qa:[["Why not feed everything straight from the battery?","Chips need different, precise voltages, and battery voltage changes as it drains. Regulators fix both."],["What is power sequencing?","Rails must come up in a fixed order and stay within limits, or logic can latch up or misbehave."]],example:"A phone that charges only when the cable is held at an angle may have a worn port, but one that never charges at all may have a dead charge path.",specs:[["Parts","Qualcomm PM7250, PM7150A and PM7250B","TD"],["Side of the board","rear-facing side (mapped by iFixit colour order)","APX"],["Rail voltages, currents","not documented","UNK"]],yours:["Part numbers for your phone are not documented (UNK). A Snapdragon 695 phone pairs with Qualcomm PMICs, but which ones is not stated.","UNK"]}),rf:pt({name:"Radio front-end chips",short:"RF chips",group:"Radio, audio and sensing",summary:"Amplify, filter and route the cellular signals between the modem and the antennas.",what:'Two Skyworks front-end modules (transmit and receive paths, and a diversity receive path), a Qualcomm envelope tracker, and a larger chip iFixit lists as "Snapdragon 865 5G Mobile Platform" (probably the RF transceiver).',why:"The modem makes a weak baseband signal. A transmit chain must lift it to a power the tower can hear, filter out everything outside the band, and share a few antennas between many bands.",how:['A power amplifier boosts the transmit signal. Filters (SAW, BAW) pass only the wanted band. Switches pick which antenna and band are used. A second receive path ("diversity") on a different antenna improves reception.',"The envelope tracker adjusts the power amplifier supply to follow the signal, so less power is wasted as heat."],links:[["soc","Modem inside the SoC"],["pmic","Supply"],["thermal","Transmit power makes heat"]],fails:"A failed front-end gives weak or no signal on some bands, calls dropping, or high battery drain while searching. Often seen after drops.",concepts:[["Computer architecture","Heterogeneous accelerators: the modem is a DSP block"],["Operating systems","Radio interface layer, airplane mode, handover"],["Electronics","RF amplifiers, filters, impedance matching, antenna tuning"],["Networking","Bands, carrier aggregation, MIMO, 4G/5G protocol stack"]],qa:[["Why does signal strength drain the battery?","In weak coverage the phone transmits at higher power, and the amplifier is the biggest power consumer in the radio."],["What is MIMO?","Using several antennas to send or receive several streams at once on the same frequency."]],example:"Moving to a basement: bars drop and the battery heats up as the phone raises transmit power.",specs:[["Parts","Skyworks SKY58094-11 and SKY53735-11, Qualcomm QET5100","TD"],["Large chip next to the SoC",'listed by iFixit only as "Snapdragon 865 5G Mobile Platform"; function inferred',"UNK"],["Antenna positions","not stated","UNK"]],yours:["5G NR bands n1/2/3/5/7/8/12/20/28/66/38/40/41/77/78 and LTE 4\xD74 MIMO (documented). The RF chips themselves are not documented.","DOC"]}),wifi:pt({name:"Wi-Fi and Bluetooth chip (WCN3998)",short:"Wi-Fi / BT",group:"Radio, audio and sensing",summary:"The chip that connects the phone to Wi-Fi and Bluetooth devices.",what:"Qualcomm WCN3998: a Wi-Fi 6-ready chip with Bluetooth 5, WPA3 security and FM radio.",why:"Wi-Fi moves data cheaply and fast at home; Bluetooth links earbuds and watches at low power. A separate chip keeps these protocols off the main modem.",how:["Wi-Fi splits data over many closely spaced subcarriers (OFDM) and uses a medium-access protocol so devices take turns on the shared air.","Bluetooth hops between channels many times a second to avoid interference."],links:[["soc","Data bus to the SoC"],["rf","Shares the antenna area"],["pmic","Supply"]],fails:"Wi-Fi that will not turn on or has very short range often means a failed chip or a detached antenna contact.",concepts:[["Computer architecture","DMA between the radio chip and RAM"],["Operating systems","Network stack, drivers, power-saving modes"],["Electronics","2.4 and 5 GHz RF, antennas"],["Networking","CSMA/CA, OFDM, association, WPA3 handshake"]],qa:[["Why does Wi-Fi slow down with many devices?","They share one channel and take turns (collision avoidance), so airtime is divided."]],example:"Two phones on one router: a big download on one halves the available airtime for the other.",specs:[["Part","Qualcomm Atheros WCN3998","TD"],["Features","Wi-Fi 6-ready, Bluetooth 5, WPA3, FM","TD"]],yours:["Wi-Fi 5 (802.11ac) and Bluetooth 5.1 with SBC, AAC, aptX HD and LDAC (documented). Different chip class.","DOC"]}),audio:pt({name:"Audio codec (WCD9385)",short:"Audio codec",group:"Radio, audio and sensing",summary:"Converts sound between digital data and analogue signals.",what:"Qualcomm WCD9385 Aqstic codec. It drives the speaker and earpiece amplifiers and digitises the microphones.",why:"Speakers and microphones are analogue; the SoC is digital. A codec with its own clean supply and amplifiers gives better sound at lower power than doing it in the noisy SoC.",how:["An analogue-to-digital converter samples the microphone voltage tens of thousands of times a second. A digital-to-analogue converter does the reverse for playback, and class-D amplifiers drive the speaker.","Digital audio travels to the SoC over a serial bus."],links:[["soc","Digital audio bus"],["speaker","Drives"],["earpiece","Drives"],["pmic","Supply"]],fails:"No sound in calls or media, or a muted microphone, with the speaker itself intact.",concepts:[["Computer architecture","Real-time audio buffers and latency"],["Operating systems","Audio HAL, mixing, scheduling deadlines"],["Electronics","ADC/DAC, sampling, class-D amplifier"],["Networking","Codec negotiation in VoLTE and Bluetooth"]],qa:[["Why sample at 48 kHz?","Nyquist: sampling must be at least twice the highest frequency you want (human hearing reaches about 20 kHz)."]],example:"A call that cuts your voice off is often the noise-suppression path (microphone array and DSP) misjudging speech.",specs:[["Part","Qualcomm WCD9385 Aqstic audio codec","TD"]],yours:["Codec not documented for your phone. Dual stereo speakers, noise cancellation and a 3.5 mm jack are documented; microphone count is not stated.","UNK"]}),battery:pt({name:"Battery BLP785",short:"Battery",group:"Power",summary:"A lithium-ion pouch cell that stores the energy: the largest single part of the phone.",what:"It stores energy as chemical potential and delivers it as current for the whole phone. It takes about half of the internal volume.",why:"Energy density sets battery life. A flat pouch cell fits the thin body and uses the space better than a cylinder.",how:["Lithium ions move between a graphite anode and a metal-oxide cathode through a separator soaked in electrolyte. Charging pushes ions into the anode; discharging lets them flow back while electrons take the outside circuit.","A protection circuit and a fuel gauge sit on the cell. They stop over-charge, over-discharge and over-current, and count charge in and out to report the percentage.","Energy = voltage \xD7 charge: 4,115 mAh \xD7 3.87 V = 15.92 Wh (CALC, matches the teardown)."],links:[["pmic","Charge and discharge path"],["usbc","Charging power arrives here"],["flex","Gauge and protection signals"],["thermal","Hot cells age faster"]],fails:"Aged cells lose capacity and cannot deliver peak current: the phone shuts off at 30% under load. A swollen battery is a safety hazard: stop using it.",concepts:[["Computer architecture","Energy per operation drives core design"],["Operating systems","Battery stats, doze mode, background limits"],["Electronics","Li-ion chemistry, CC/CV charging, internal resistance"],["Networking","Radios are a big share of consumption"]],qa:[["Why does a phone charge fast to 80% then slow?","Constant current until the cell reaches its voltage limit, then constant voltage with falling current to protect the cell."],["mAh or Wh?","Wh compares batteries of different voltages; mAh only works at the same voltage."]],example:"A 15.92 Wh battery running a 2 W workload lasts about 8 hours (15.92 \xF7 2 = 7.96 h, CALC).",specs:[["Label","BLP785","TD"],["Capacity","4,115 mAh at 3.87 V = 15.92 Wh","TD"],["Fixing","lightly adhered, with a pull tab","TD"],["Size","\u2248 46 \xD7 90 \xD7 5 mm","APX"]],yours:["5,500 mAh for the India model (CPH2619, third-party), 5,110 mAh typical for the global model (documented: 19.83 Wh typical, 19.37 Wh rated). 80W SUPERVOOC, 55 W in 110 V regions (documented).","3RD"]}),usbc:pt({name:"USB-C port",short:"USB-C",group:"Power",summary:"The charging and data connector on the bottom edge.",what:"A reversible connector for the charger, data transfer and accessories.",why:"One small connector with two rows of pins, so it works either way up and can carry both power and data.",how:["Pins carry power (VBUS), ground, data pairs and two configuration (CC) pins. The CC pins tell each side which way round the plug is and which role it plays.","Fast charging negotiates the charger voltage and current through the connector before the high power starts."],links:[["bottomboard","Soldered to it"],["pmic","Charge path"],["flex","Signals travel to the main board"]],fails:"Lint, bent pins or wear: charges only at an angle, or not at all. The documentation notes the port is individually replaceable.",concepts:[["Computer architecture","USB host/device roles, enumeration"],["Operating systems","USB stack, drivers, plug events"],["Electronics","Connector wear, contact resistance, ESD protection"],["Networking","USB power-delivery and vendor charging protocols are negotiated messages"]],qa:[["Why can a bad cable charge slowly?","Resistance in thin wires drops voltage under high current, and the charger or phone then reduces current."]],example:"Try a different cable before blaming the phone: charging problems are most often cable or lint.",specs:[["Connector","USB-C on a replaceable bottom board","TD"],["Data speed","not stated in the teardown","UNK"]],yours:["USB 2.0 Type-C (documented), with 80W SUPERVOOC charging and a separate 3.5 mm headphone jack.","DOC"]}),camera:pt({name:"Rear camera modules",short:"Cameras",group:"Radio, audio and sensing",summary:"Four small camera modules in a line, each with a lens and an image sensor.",what:"A 48 MP main camera (Sony IMX586, stabilised), an 8 MP ultra-wide, a 5 MP depth and a 2 MP macro camera.",why:"One lens cannot be wide, close and zoomed at once in a 8 mm body, so phones use several small fixed lenses and combine their results.",how:["Light passes through the lens onto a sensor of millions of photodiodes under a colour-filter mosaic. Each pixel counts photons; the processor rebuilds the colour image (demosaicing).","Optical image stabilisation moves the lens or sensor with a magnetic actuator to cancel hand shake. The sensor sends raw data to the SoC over a high-speed serial interface (MIPI CSI)."],links:[["soc","MIPI camera interface to the ISP"],["pmic","Several clean supplies"],["flex","Own flex cable to the board"]],fails:'Blurry or black pictures, "camera error", rattling from a damaged stabiliser, dust or a cracked lens.',concepts:[["Computer architecture","Image signal processors, DMA, ping-pong buffers"],["Operating systems","Camera HAL, frame pipeline, permissions"],["Electronics","CMOS sensors, noise, rolling shutter, voice-coil motors"],["Networking","HEIC/JPEG compression affects upload size"]],qa:[["What does pixel binning do?","It combines neighbouring pixels (for example 4 into 1) to gain light and cut noise, trading resolution."]],example:"A photo at night: the phone takes several frames and combines them to reduce noise.",specs:[["Main","48 MP, f/1.75, optical stabilisation, Sony IMX586 (reportedly)","TD"],["Others","8 MP f/2.25 ultra-wide (119\xB0), 5 MP f/2.4 depth, 2 MP f/2.4 macro","TD"],["Position","a straight line on one edge of the back","TD"]],yours:['50 MP Sony LYT-600 (1/1.95", f/1.8, OIS and EIS) plus a 2 MP f/2.4 depth camera and dual LED flash. Front 16 MP f/2.4. (documented)',"DOC"]}),frontcam:pt({name:"Front cameras",short:"Selfie",group:"Outside",summary:"Two hole-punch selfie cameras behind the display.",what:"A 32 MP main camera (Sony IMX616, electronic stabilisation only) and an 8 MP ultra-wide (105\xB0).",why:"Selfies and video calls. A hole in the display uses less area than a notch.",how:["The display has a small hole where the lenses look out. The modules sit under it and connect by their own flex.","The same sensor and processing chain as the rear cameras, at lower resolution."],links:[["soc","MIPI camera interface"],["display","Lenses look through the display hole"],["flex","Flex to the board"]],fails:"Dark or blurry selfies, camera error in video calls.",concepts:[["Operating systems","Camera permissions and indicators"],["Electronics","Small CMOS sensors"],["Networking","Video call codecs and latency"]],qa:[["Why do selfies look softer?","Smaller sensor, fixed focus lens and aggressive smoothing."]],example:"A video call uses the front camera, the codec block and the radio at once: battery and temperature rise noticeably.",specs:[["Main","32 MP f/2.45, Sony IMX616, EIS only","TD"],["Wide","8 MP f/2.45, 105\xB0","TD"],["Position","top corner (product photos)","3RD"]],yours:["16 MP f/2.4, fixed focus, a single front camera (documented).","DOC"]}),earpiece:pt({name:"Earpiece speaker",short:"Earpiece",group:"Outside",summary:"The small speaker you hold to your ear, at the top edge.",what:"It plays the other person's voice in calls and can join the main speaker for stereo.",why:"A separate quiet speaker at the right distance gives clear calls without being loud to others.",how:["A voice coil in a magnet's field moves a thin diaphragm when the audio current flows.","The codec drives it; a slot along the top edge lets the sound out."],links:[["audio","Driven by the codec"]],fails:"Quiet or crackling calls, but speaker playback still works.",concepts:[["Electronics","Electromagnetic transducers"],["Networking","Voice codecs in calls (AMR, EVS)"]],qa:[["Why is voice narrower than music?","Voice codecs keep roughly 300 Hz to 3.4 kHz (narrowband) or up to 7 kHz (wideband) to save bandwidth."]],example:"When calls sound muffled in a case, the case may cover the earpiece slot.",specs:[["Position","top centre edge","APX"],["Part details","not documented","UNK"]],yours:["Dual stereo speakers (documented). Which driver is the earpiece is not stated.","DOC"]}),speaker:pt({name:"Loudspeaker module",short:"Speaker",group:"Radio, audio and sensing",summary:"The loud speaker at the bottom edge.",what:"Plays music, video and call audio at speaker volume.",why:"A bigger driver in an enclosed volume at the bottom can move enough air to be loud.",how:["The same moving-coil principle as the earpiece but larger, in a small sealed chamber that sets the bass response.","A grille at the bottom edge lets the sound out; a mesh keeps dust out."],links:[["audio","Driven by the codec amplifier"],["bottomboard","Sits beside it"]],fails:"Crackle or silence: a damaged diaphragm, blocked grille or a poor spring contact.",concepts:[["Electronics","Transducers, enclosure volume, impedance"],["Operating systems","Audio routing between speaker, earpiece, Bluetooth"]],qa:[["Why does bass sound weak on phones?","A tiny diaphragm and enclosure cannot move enough air at low frequency."]],example:"Cup your hand around the bottom grille and the sound changes: you are changing the acoustic load.",specs:[["Position","bottom edge, speaker port","TD"],["Size","\u2248 26 \xD7 8 mm","APX"]],yours:["Dual stereo speakers and a 300% Ultra Volume mode (documented). Layout not documented.","DOC"]}),vib:pt({name:"Vibration motor",short:"Haptics",group:"Radio, audio and sensing",summary:"A small motor that shakes the phone for alerts and touch feedback.",what:"It produces buzzes and taps for notifications and keyboard feedback.",why:"Touch feedback and silent alerts. Better motors give crisp taps rather than a long buzz.",how:["A rotating weight off-centre makes the phone shake, or a linear actuator drives a mass back and forth with a coil. Short, sharp pulses feel like a tap.","The OS sends a pattern; a driver turns it into current."],links:[["bottomboard","Connected through the bottom board"]],fails:"No vibration, weak or noisy buzz.",concepts:[["Electronics","Motors, drivers, back-EMF"],["Operating systems","Haptics API and patterns"]],qa:[["Why is the motor near the bottom?","Close to the bottom board and away from the antennas and cameras."]],example:'The keyboard "click" you feel comes from a few milliseconds of motor drive.',specs:[["Type","round, coin-style (iFixit photo)","TD"],["Position","bottom section","APX"]],yours:["Not documented for your phone.","UNK"]}),display:pt({name:"AMOLED display and touch panel",short:"Display",group:"Outside",summary:"The screen: self-lit pixels, a touch sensor and the glass.",what:"It shows everything and senses your finger.",why:"An OLED pixel makes its own light, so black pixels use no power and contrast is very high; there is no backlight layer.",how:["Every sub-pixel is an organic light-emitting diode driven by transistors on a thin-film backplane. A row-by-row scan rewrites the picture at the refresh rate.","A transparent grid of electrodes senses the change in capacitance where a finger touches. A controller finds the touch position and sends it to the SoC.","The panel is fed over a display interface from the SoC and powered by its own rails."],links:[["soc","Pixel stream and touch data"],["flex","Flex cable to the bottom board"],["fp","Fingerprint sensor sits behind it"],["frontcam","Camera hole"]],fails:"Cracks, dead lines, green tint or burn-in. The display is glued in and is the part most often replaced.",concepts:[["Computer architecture","Frame buffers, scan-out, vsync, GPU composition"],["Operating systems","Choreographer, vsync scheduling, touch event dispatch"],["Electronics","Capacitive sensing, OLED drive, PWM dimming"],["Networking","None directly"]],qa:[["Why does 120 Hz feel smoother?","A frame lasts 8.3 ms instead of 16.7 ms (CALC: 1000 \xF7 120), so motion steps are smaller and latency is lower."],["Why OLED burn-in?","Pixels age with use; a fixed bright image wears some more than others."]],example:"Dark mode saves battery on an OLED because black pixels are off.",specs:[["Type","AMOLED, glued into the bezel","TD"],["Size and refresh","6.44 in, 90 Hz (third-party)","3RD"],["Fingerprint","rectangular cut-out behind the display","TD"]],yours:["6.67 in AMOLED, 1080 \xD7 2400 (394 ppi), 120 Hz, 1200 / 2100 nits (HBM / peak), PWM 480 Hz, 100% sRGB and Display P3 (documented). Touch sampling rate not stated.","DOC"]}),fp:pt({name:"Under-display fingerprint sensor",short:"Fingerprint",group:"Outside",summary:"A sensor behind the display that reads your fingerprint.",what:"It unlocks the phone and authorises payments by matching a fingerprint.",why:"It is faster than a code and keeps the front clean without a button.",how:["An optical sensor lights the finger through the display and images the ridges; the pattern is turned into a template and compared with the stored one.","The match happens in a secure area of the SoC; the template never leaves it."],links:[["display","Sits behind the glass"],["flex","Breakout flex to the bottom board"],["soc","Secure processing"]],fails:"Slow or failed unlocks: a dirty or cracked screen, a bad screen protector, or a damaged sensor flex.",concepts:[["Computer architecture","Trusted execution environment (TEE)"],["Operating systems","Biometric HAL, keystore"],["Electronics","Optical imaging through OLED"],["Networking","None: matching is on-device"]],qa:[["Why is the fingerprint template safe?","It is stored and compared inside the secure world; the OS never sees the image."]],example:"A cheap screen protector can break an under-display sensor by blocking light.",specs:[["Position",'behind the display, a "somewhat oddly tilted" cut-out',"TD"],["Type","not stated by iFixit","UNK"]],yours:["In-display fingerprint sensor (documented; one third-party says optical).","DOC"]}),board:pt({name:"Motherboard (PCB)",short:"Board",group:"Boards and cables",summary:"The main circuit board that holds the SoC, memory, power and radio chips.",what:"A multi-layer board with copper tracks between all the chips, with connectors for the displays, cameras and flexes.",why:"Mass-produced tracks connect thousands of pins reliably in a few square centimetres.",how:["Layers of fibreglass and thin copper with tiny plated holes (vias) between them. High-speed buses such as memory are routed with matched lengths so every bit arrives together.","Chips are soldered on both sides. Metal shield cans over the noisy and the sensitive ones stop interference.","Two screws hold it; battery and display connectors keep gaskets."],links:[["soc","Carries"],["memory","Carries"],["pmic","Carries"],["flex","Connectors at the bottom edge"],["camera","Camera connectors"],["thermal","Graphite foil and paste on the chips"]],fails:"Cracks near connectors or drops, corrosion after liquid: random faults, no boot or no charge. Repair is chip-level work.",concepts:[["Computer architecture","Buses, bandwidth, signal integrity"],["Operating systems","Device tree describes what is on the board"],["Electronics","Layers, vias, impedance, EMI shielding"],["Networking","Differential serial links (MIPI, UFS, USB)"]],qa:[["Why is the board a funny shape?","It wraps around the camera modules and the battery to use every millimetre."]],example:"Liquid damage shows as green or white residue around connectors on the board.",specs:[["Outline","traced from the iFixit photo, with a camera cut-out","APX"],["Size","\u2248 66 \xD7 49 mm","APX"],["Fixing","two Phillips screws","TD"],["Layer count","not documented","UNK"]],yours:["Board shape and layout for your phone are not documented (UNK).","UNK"]}),bottomboard:pt({name:"Bottom board (daughterboard)",short:"Bottom board",group:"Boards and cables",summary:"A small board at the bottom with the USB-C port, the SIM tray reader and the microphone.",what:"It carries the USB-C port, the SIM reader and the display connector, and joins the long flex cables.",why:"Parts that wear (port, SIM) sit on a small cheap board so they can be replaced without the main board.",how:["A short board with connectors. The long flex cables carry power, data and the display signal up to the main board.","A rubber gasket on each connector keeps out dust and splashes."],links:[["usbc","Carries"],["sim","Carries"],["flex","Three long flex cables"],["display","Display connector"],["fp","Fingerprint breakout"],["vib","Vibration motor"],["speaker","Speaker"]],fails:"Charging, SIM or microphone faults; often cheaper to replace than the main board.",concepts:[["Electronics","Modular design, connectors, gaskets"],["Computer architecture","Interconnect topology"]],qa:[["Why split the phone into boards?","Repair cost, and fitting round the battery."]],example:"Replacing the charge port board fixes most charging faults at a fraction of a motherboard swap.",specs:[["Parts on it","USB-C, SIM reader, microphone hole, display connector (no gasket on the display connector)","TD"],["Size","approximate","APX"]],yours:["Layout not documented for your phone (UNK).","UNK"]}),flex:pt({name:"Interconnect flex cables",short:"Flex cables",group:"Bo
